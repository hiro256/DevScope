[package]
name = "devscope"
version = "0.4.0"
edition = "2024"
description = "A project-centric progress observer for AI-assisted software development"

[dependencies]
crossterm = "0.29.0"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
time = { version = "0.3.44", features = ["formatting", "local-offset", "macros", "parsing"] }
toml = "0.9"
